[project]
name = "plp-sim"
version = "0.1.0"
description = "Persona simulation of the Parliamentary Labour Party, with honest error decomposition"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "kmedoids>=0.5.3",
    "openai>=2.0",
    "tenacity>=9.0",
    "diskcache>=5.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pyarrow>=17.0",
    "networkx>=3.6.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plp_sim"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
