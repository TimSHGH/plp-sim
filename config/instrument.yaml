# The instrument. Three questions.
#
# Each is asked as a forecast -- "what would you do" -- and then compared against
# what the 405 real Labour MPs actually did after the cutoff. Every question here
# has a known answer we withheld, which is the only reason any number downstream
# is worth anything.
#
# The three do two jobs:
#
#   v_loyalty     THE DECISION. Asked plain, and again at four levels of visible
#                 pressure (see `pressure_panel`). Every level is scored, so the
#                 cascade is checked at every step rather than assumed.
#   v_nomination  Evidence the method generalises. A different behaviour --
#                 timing under uncertainty -- that nothing was tuned for.
#   v_rebellion   Same again, on a third behaviour: defying the whip.
#
# The last two matter more than they look. Without them, "did you tune this until
# the loyalty question worked?" has no answer.
#
# Contract notes for anyone editing this file:
#   * `tokens` must be single tokens after `.strip()`. Single capital letters are
#     the safe choice. elicit.py probes at startup that every token actually
#     appears in the model's top-20 -- an option that never surfaces is a broken
#     item, not a rare answer.
#   * `options` is the FORWARD order. The reversed arm is generated by reversing
#     this list and re-lettering; probabilities are always stored back against
#     forward order so the two arms are directly comparable.
#   * `outcome_map` must use the EXACT outcome labels in holdout.parquet, in the
#     same order as `options`. A wrong label does not raise: the observed
#     marginal comes back all zeros and every method scores a plausible-looking
#     0.500. tests/test_instrument.py checks this against the real holdout.
#   * Never write a bare `No`, `Yes`, `On` or `Off` as an option. YAML 1.1
#     coerces them to booleans and the model is then shown the literal string
#     "False" as an answer choice. Quote them.
#
# Removed, and why: a nomination-threshold sweep and a "leader or policy
# direction" item were built and cut. The first duplicated what v_loyalty already
# measures; the second returned 98.5% one-sided, which is a measurement failure
# rather than a result. Four diagnostic reframings of v_loyalty were also run and
# cut from the instrument -- they are reported in the write-up as the record of
# what was tried, not carried here as live questions.

prompt_version: v1

# `items` is the canonical list. `validation_items` is an alias for the same
# three, because all three ARE validated -- there is no second, unscored set.
items: &questions

  # ---- THE DECISION ------------------------------------------------------
  # Scored against who publicly backed the leader, called for them to go, or
  # said nothing, over the 405. A near coin-flip (49.9% base rate), and a real
  # decision taken when nobody knew how it would end.
  #
  # DO NOT REWORD THIS STEM. Removing "with colleagues briefing against them"
  # moves backbench defection from ~2% to ~85%; observed was 30.1%. The clause is
  # kept deliberately because it is the CONSERVATIVE side of that sensitivity --
  # results reported from it understate the effect rather than flatter it. That
  # is a defensible choice only while it is stated out loud.
  - id: v_loyalty
    holdout_event: starmer_loyalty
    text: >-
      Your party leader is under sustained public pressure, with colleagues
      briefing against them and the outcome genuinely uncertain. Journalists are
      asking every MP for their position. What do you do?
    tokens: [A, B, C]
    options:
      - Publicly back the leader and say they should stay
      - Publicly say the leader should go
      - Say nothing publicly either way
    outcome_map: [backed_starmer, called_for_exit, silent]

  # ---- EVIDENCE IT GENERALISES -------------------------------------------
  # Timing under uncertainty. Heavily skewed (79.5% declared day one), so it is
  # reported against that base rate and never as raw accuracy.
  - id: v_nomination
    holdout_event: leadership_nomination
    text: >-
      A leadership contest has opened. One candidate is the clear front-runner
      and nominations close in a week. Colleagues are declaring for them within
      hours of nominations opening. When do you declare?
    tokens: [A, B]
    options:
      - Declare for the front-runner straight away, on the first day
      - Hold back, whether to wait, to weigh it up, or not to nominate at all
    outcome_map: [day1_bandwagon, held_back]

  # A third behaviour, and the one the method does best on. `rebellion_rate` is
  # in the persona record, so this tests whether the model uses a behavioural
  # precedent it has been given -- it does, correlation +0.68.
  - id: v_rebellion
    holdout_event: post_cutoff_rebellion
    text: >-
      Over the coming year, on the government legislation that comes before the
      House, how do you expect to vote when the whip and your own judgement pull
      in different directions?
    tokens: [A, B]
    options:
      - I would vote against the whip at least once
      - I would vote with the whip every time
    outcome_map: [rebelled, loyal]

validation_items: *questions

# ---------------------------------------------------------------------------
# The pressure panel -- v_loyalty asked four times, and the exact configuration
# behind outputs/AS_network_viz.html.
#
# Only the final sentence changes between levels. Personas, network, layout,
# options and decoding are identical, so a persona that changes its answer has
# changed its mind rather than been asked a different question.
#
# DO NOT REWORD ANYTHING IN THIS BLOCK. It is not style, it is the experiment.
# Editing a word silently changes every published number and invalidates the
# cache.
#
# The manifesto is conditioned on each persona's own `is_payroll`, which took
# payroll accuracy from 0.005 to 0.641: ministers are bound by collective
# responsibility and 94.6% of real ones said nothing, so the two groups are not
# doing the same thing and one uniform prompt cannot say so.
#
# Known limitation, worth stating rather than hiding: the backbench half of this
# manifesto contains an incentive claim ("early supporters of the winner get
# promoted"), and on a question about signing a nomination form that claim acts
# as an instruction rather than context, moving the answer 64 points. It is
# admissible here because this question asks about making a public statement,
# not about signing anything -- but it does not generalise, and a persona reused
# on a different question needs this half removed.
# ---------------------------------------------------------------------------
pressure_panel:
  base_item: v_loyalty
  method: P2C
  successor_premise: " A senior colleague is widely seen as a stronger candidate and consistently polls better than the current leader; if the leader went, they would be the likely successor."
  manifesto:
    payroll: "\n\nWhere you stand: you hold a government post. Ministers and parliamentary private secretaries are bound by collective responsibility and do not comment publicly on the leadership; an MP who wants to say something about it resigns the post first. Your career runs through the government, whoever leads it."
    backbench: "\n\nWhere you stand: you hold no government post. You are free to speak and you have no post to lose by speaking. Backbenchers who publicly support the eventual winner early are the ones a new leader promotes; those who are late, or who back the side that loses, wait another parliament for the chance."
  levels:
    - {id: none, label: "Nobody has moved", social: ""}
    - {id: few,  label: "A handful have moved", social: " A handful of backbenchers have already publicly called for the leader to go."}
    - {id: some, label: "Around fifty have moved", social: " Around fifty of your colleagues have already publicly called for the leader to go."}
    - {id: many, label: "Over a hundred have moved", social: " Well over a hundred of your colleagues, including several former ministers, have already publicly called for the leader to go."}
